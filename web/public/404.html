<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Página no encontrada — AIRO Color Lab</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #111111; color: #ffffff; min-height: 100vh;
      display: grid; place-items: center; padding: 24px; line-height: 1.6;
    }
    .box { max-width: 480px; text-align: center; }
    .kicker { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #00b4d8; margin-bottom: 14px; }
    h1 { font-family: Georgia, 'Times New Roman', serif; font-size: clamp(34px, 7vw, 52px); line-height: 1.05; margin-bottom: 16px; }
    p { color: rgba(255,255,255,.75); font-size: 15px; margin-bottom: 32px; }
    .btn {
      display: inline-block; padding: 15px 30px; border-radius: 999px;
      font-size: 15px; font-weight: 600; text-decoration: none;
      background: #ffffff; color: #111111; transition: background .15s, transform .15s;
    }
    .btn:hover { background: #00b4d8; transform: translateY(-2px); }
    .link { color: #00b4d8; }
  </style>
</head>
<body>
  <div class="box">
    <p class="kicker">Error 404</p>
    <h1>Esta página se salió del molde.</h1>
    <p>La dirección que buscás no existe o fue movida.</p>
    <a class="btn" href="/">Volver al inicio</a>
  </div>
</body>
</html>
