name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Project checks (anchors, image paths, alt text)
        run: npm run check

      - name: Quote regression tests
        run: node --test tests/quote.test.mjs

      - name: Build
        run: npm run build
        env:
          CI: true
